<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonando · Control</title>
<link rel="stylesheet" href="/base.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto 1fr; font-size: 14.5px; background: #0d0c0e; overflow: hidden; }

  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; border-radius: 8px; }
  input {
    width: 100%; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--fill); transition: border-color 150ms ease, background-color 150ms ease; caret-color: var(--rose);
  }
  input::placeholder { color: var(--ink-3); }
  input:focus { outline: none; border-color: color-mix(in oklch, var(--rose) 60%, transparent); background: var(--fill-2); }
  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--fill-2); font-weight: 600; white-space: nowrap; transition: transform 140ms var(--ease-out), background-color 150ms ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--ink); color: #111; }
  .btn.rose { background: color-mix(in oklch, var(--rose) 26%, transparent); color: var(--rose-ink); }
  .btn.icon { width: 34px; height: 34px; padding: 0; border-radius: 9px; background: none; color: var(--ink-3); }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }
  @media (hover: hover) {
    .btn:hover { background: rgb(255 255 255 / .16); }
    .btn.primary:hover { background: #fff; }
    .btn.icon:hover { color: var(--ink); background: var(--fill-2); }
  }

  /* Barra superior */
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .brand { font-size: 18px; font-weight: 760; letter-spacing: -0.03em; display: flex; align-items: center; gap: 10px; }
  .pills { display: flex; gap: 6px; padding: 4px; border-radius: 99px; background: var(--fill); }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 99px; color: var(--ink-2); font-size: 13px; font-weight: 600;
    max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background-color 150ms ease, color 150ms ease; }
  .pill span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .pill[hidden] { display: none; }
  @media (hover: hover) { .pill:hover { background: var(--fill-2); color: var(--ink); } }
  /* ventanita bajo cada pastilla: nace desde la pastilla (origen arriba), rápida y sin rebote */
  .pop { position: fixed; z-index: 30; width: 320px; padding: 16px; border-radius: 16px; background: #1a191c; display: grid; gap: 10px;
    box-shadow: 0 24px 60px -16px rgb(0 0 0 / .7), inset 0 0 0 1px var(--line); transform-origin: var(--ox, 50%) 0;
    transition: opacity 160ms ease, transform 180ms var(--ease-out); }
  .pop[hidden] { display: grid; visibility: hidden; opacity: 0; transform: translateY(-4px) scale(.97); pointer-events: none; }
  .pop h4 { font-size: 13.5px; font-weight: 700; }
  .pop p { color: var(--ink-2); font-size: 13px; line-height: 1.45; }
  .pop .row { display: flex; gap: 8px; }
  .acts { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .btn.ghost { background: none; color: var(--ink-2); text-decoration: none; }
  #devBtn[aria-pressed="true"] { background: color-mix(in oklch, var(--warn) 22%, transparent); color: oklch(0.92 0.08 75); }
  .brand svg { color: var(--rose); font-size: 20px; }
  .conn { display: flex; align-items: center; gap: 8px; }
  .conn input { width: 180px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.on, .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ok) 22%, transparent); }
  .dot.connecting { background: var(--warn); }
  .status { color: var(--ink-2); font-size: 13px; }
  .err { color: oklch(0.78 0.14 25); font-size: 13px; }
  a.link { color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink-3); }

  /* Tres columnas */
  .cols { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(340px, 1.1fr) minmax(320px, 1fr); min-height: 0; }
  .col { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; border-right: 1px solid var(--line); }
  .col:last-child { border-right: 0; }
  .col > header { padding: 22px 24px 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .col h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
  .col h2 + span { color: var(--ink-3); font-size: 13px; }
  .scroll { overflow: auto; min-height: 0; padding: 0 14px 20px; scrollbar-width: thin; scrollbar-color: rgb(255 255 255 / .14) transparent; }

  .av { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; flex: none; }

  /* Chat */
  .msg { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: start; padding: 8px; border-radius: 12px;
    text-align: left; width: 100%; transition: background-color 150ms ease; }
  .msg b { font-size: 12.5px; font-weight: 600; color: var(--ink-3); display: block; }
  .msg .pts { font-style: normal; margin-left: 8px; padding: 1px 7px; border-radius: 99px; background: var(--fill-2); color: var(--ink-2); font-size: 11.5px; }
  .msg p { line-height: 1.4; overflow-wrap: anywhere; }
  .msg .copy { opacity: 0; transition: opacity 150ms ease; }
  .msg.gift p { color: var(--rose-ink); font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .msg.gift p svg { color: var(--rose); }
  .msg.gift .gimg { width: 26px; height: 26px; object-fit: contain; flex: none; }
  .msg.picked { background: color-mix(in oklch, var(--rose) 14%, transparent); }
  @media (hover: hover) { .msg:hover { background: var(--fill); } .msg:hover .copy { opacity: 1; } }
  .msg .copy:focus-visible { opacity: 1; }
  .empty { color: var(--ink-3); padding: 24px 8px; line-height: 1.5; }
  .sim { border-top: 1px solid var(--line); padding: 14px 20px 16px; background: color-mix(in oklch, var(--warn) 6%, transparent); }
  .sim h3 { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
  .sim h3 span { color: var(--warn); font-weight: 600; }
  .sim .row { display: grid; grid-template-columns: 120px 1fr; gap: 8px; margin-top: 10px; }
  .sim .acts { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .gifts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .gifts .btn { height: auto; padding: 8px 6px; flex-direction: column; gap: 2px; font-size: 12.5px; }
  .gifts .btn small { color: var(--ink-3); font-weight: 600; font-size: 11.5px; }
  .cnt { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
  .cnt input { width: 76px; height: 34px; }
  #devBtn[aria-pressed="true"] { background: color-mix(in oklch, var(--warn) 30%, transparent); color: oklch(0.92 0.08 75); }

  /* Búsqueda */
  /* columna del medio: buscador fijo arriba y los resultados con su propio scroll */
  #mid { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; overflow: hidden; }
  .searchbar { padding: 0 20px 12px; display: grid; gap: 10px; }
  .field { position: relative; }
  .field svg { position: absolute; left: 12px; top: 11px; color: var(--ink-3); font-size: 16px; }
  .field input { padding-left: 36px; height: 44px; font-size: 15px; }
  .for { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; min-height: 24px; }
  .for .av { width: 22px; height: 22px; font-size: 10px; }
  .for b { color: var(--ink); }
  .res { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: 12px;
    transition: background-color 150ms ease; }
  @media (hover: hover) { .res:hover { background: var(--fill); } }
  .res.alb { width: 100%; text-align: left; }
  .reshead { font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin: 18px 8px 6px; letter-spacing: .02em; }
  .albhead { display: grid; grid-template-columns: auto 64px 1fr auto; gap: 12px; align-items: center; padding: 4px 8px 14px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
  .albhead img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
  .albhead b { display: block; font-weight: 700; } .albhead small { color: var(--ink-2); font-size: 12.5px; }
  .albhead [data-back] svg { transform: rotate(-90deg); }
  .res img, .row-q img { width: 52px; height: 52px; border-radius: 9px; object-fit: cover; background: var(--fill-2); }
  .res b, .row-q b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
  .res small, .row-q small { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res > span, .row-q > span { min-width: 0; }
  .note { margin: 0 20px 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45; }
  .note.bad { background: color-mix(in oklch, oklch(0.65 0.18 25) 18%, transparent); color: oklch(0.86 0.08 25); }
  .note.good { background: color-mix(in oklch, var(--ok) 15%, transparent); color: oklch(0.9 0.07 150); }
  .setup { padding: 4px 20px 20px; line-height: 1.55; color: var(--ink-2); display: grid; gap: 14px; }
  .setup ol { padding-left: 18px; display: grid; gap: 8px; }
  .setup b { color: var(--ink); }
  .setup code { font-size: 12.5px; padding: 2px 6px; border-radius: 6px; background: var(--fill-2); color: var(--ink); user-select: all; }

  /* Cola */
  .nowp { margin: 0 20px 14px; padding: 14px; border-radius: 16px; background: var(--fill); display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
  .nowp img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--fill-2); }
  .nowp b { display: block; font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nowp small { display: block; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nowp .bar { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; color: var(--ink-3); font-size: 12px; }
  .nowp .track { height: 4px; border-radius: 9px; background: rgb(255 255 255 / .12); overflow: hidden; }
  .nowp .fill { height: 100%; background: var(--ink-2); transform-origin: left; transform: scaleX(0); }
  .col:last-child { grid-template-rows: auto auto auto 1fr auto; }
  .scorebar { margin: 0 20px 14px; padding: 12px 14px 10px; border-radius: 14px; background: var(--fill); }
  .scorebar .sbtop { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; }
  .scorebar .sbtop b { margin-left: auto; color: var(--ink); font-size: 15px; }
  .scorebar .sbtop .btn { height: 30px; padding: 0 10px; font-size: 12.5px; }
  .scorebar input { width: 100%; height: 28px; padding: 0; border: 0; background: none; margin-top: 6px; accent-color: oklch(0.86 0.13 90); }
  .scorebar input::-webkit-slider-runnable-track { height: 10px; border-radius: 99px;
    background: linear-gradient(90deg, oklch(0.62 0.2 25), oklch(0.74 0.15 55) 30%, oklch(0.86 0.13 90) 50%, oklch(0.78 0.16 140) 70%, oklch(0.7 0.17 155)); }
  .scorebar input::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgb(0 0 0 / .5); }
  .scorebar input { -webkit-appearance: none; }
  .sblab { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 11.5px; margin-top: 2px; }
  .fxbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 20px 14px; }
  .fxbar #cine[aria-pressed="true"] { background: var(--ink); color: #111; }
  .beatdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); transition: background-color 120ms ease, transform 120ms ease; }
  #beatBtn[aria-pressed="true"] .beatdot { background: var(--ok); }
  .beatdot.hit { transform: scale(1.8); background: #fff !important; transition-duration: 0ms; }
  .sync { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; color: var(--ink-2); font-size: 13px; }
  .sync .btn { height: 34px; padding: 0 10px; }
  .judge { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; }
  .btn.mehv { background: color-mix(in oklch, oklch(0.75 0.11 78) 24%, transparent); color: oklch(0.9 0.07 80); padding: 0 18px; }
  .judge .coins { justify-content: center; border-radius: 10px; }
  .btn.like { background: color-mix(in oklch, var(--ok) 22%, transparent); color: oklch(0.9 0.08 150); }
  .btn.savev { background: color-mix(in oklch, oklch(0.7 0.14 240) 30%, transparent); color: oklch(0.9 0.07 240); height: 46px; font-size: 15px; }
  .btn.lovev { background: color-mix(in oklch, var(--rose) 18%, transparent); color: var(--rose-ink); }
  .btn.skipv { background: color-mix(in oklch, oklch(0.65 0.18 25) 22%, transparent); color: oklch(0.88 0.08 25); }
  .manual { margin: 0 8px 12px; padding: 14px; border-radius: 14px; display: grid; gap: 10px; line-height: 1.45; color: var(--ink-2);
    background: color-mix(in oklch, var(--warn) 12%, transparent); }
  .manual b { color: var(--ink); }
  .manual .btn { text-decoration: none; justify-content: flex-start; overflow: hidden; text-overflow: ellipsis; }
  .row-q .cv { position: relative; display: block; width: 52px; height: 52px; }
  .row-q .cv .av { position: absolute; right: -5px; bottom: -5px; width: 22px; height: 22px; font-size: 10px; box-shadow: 0 0 0 2px #0d0c0e; }
  .row-q .ctl { display: flex; gap: 2px; }
  .row-q .ctl [data-move]:disabled { visibility: hidden; }
  .row-q { display: grid; grid-template-columns: 22px 52px 1fr auto auto; gap: 12px; align-items: center; padding: 8px; border-radius: 12px; }
  .row-q .pos { color: var(--ink-3); text-align: right; font-weight: 600; font-size: 13px; }
  .row-q .pos svg { color: var(--ink); }
  .row-q.locked { background: var(--fill); }
  .coins { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; color: var(--rose-ink);
    padding: 3px 8px 3px 6px; border-radius: 99px; background: color-mix(in oklch, var(--rose) 20%, transparent); }
  .coins svg { color: var(--rose); font-size: 15px; }
  .credits { border-top: 1px solid var(--line); padding: 12px 20px 16px; color: var(--ink-2); font-size: 13px; line-height: 1.6; }
  .credits b { color: var(--ink); font-weight: 600; }

  @media (max-width: 1100px) {
    body { overflow: auto; grid-template-rows: auto auto; }
    .top { flex-wrap: wrap; gap: 12px 20px; }
    .cols { grid-template-columns: 1fr; min-height: auto; }
    .col { min-height: auto; }
    .col { border-right: 0; border-bottom: 1px solid var(--line); }
    .col .scroll { max-height: 55vh; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" title="Volver al inicio" style="color:inherit;text-decoration:none"><span id="brandIcon"></span>Sonando</a>
  <nav class="pills" aria-label="Conexiones">
    <button class="pill" data-pop="tt" aria-haspopup="dialog" title="TikTok"><span class="dot" id="ttDot"></span><span id="ttStatus">TikTok</span></button>
    <button class="pill" data-pop="sp" aria-haspopup="dialog" title="Spotify"><span class="dot" id="spDot"></span><span id="spStatus">Spotify</span></button>
    <button class="pill" data-pop="cloud" aria-haspopup="dialog" id="cloudBox" hidden title="Supabase"><span class="dot" id="cloudDot"></span><span id="cloudStatus">Supabase</span></button>
  </nav>
  <div class="acts">
    <a class="btn ghost" href="/">Inicio</a>
    <a class="btn ghost" href="/stage" target="_blank">Pantalla del directo</a>
    <a class="btn ghost" href="/top" target="_blank">Top</a>
    <button class="btn ghost" id="devBtn" aria-pressed="false">Desarrollador</button>
    <button class="btn" id="setBtn">${icon.gear}Ajustes</button>
  </div>
</header>

<div class="pop" id="pop" role="dialog" hidden></div>

<main class="cols">
  <section class="col">
    <header><h2>Chat del directo</h2><span>Pulsa un mensaje para buscarlo</span></header>
    <div class="scroll" id="chat"></div>
    <section class="sim" id="dev" hidden>
      <h3>Modo desarrollador <span>todo es de mentira</span></h3>
      <div class="row">
        <input id="simNick" value="maria_23" aria-label="Quién lo manda" spellcheck="false">
        <input id="simText" value="ponme ojitos lindos de bad bunny" aria-label="Mensaje de chat falso">
      </div>
      <div class="acts"><button class="btn" data-sim="chat">Enviar mensaje</button>
        <button class="btn" id="simRandom">Usuario al azar</button></div>
      <div class="gifts" id="gifts"></div>
      <div class="acts"><label class="cnt">Cantidad <input id="simCount" type="number" min="1" max="999" value="1"></label>
        <button class="btn icon" id="simReset" title="Borrar saldo de regalos" aria-label="Borrar saldo de regalos"></button></div>
    </section>
  </section>

  <section class="col">
    <header><h2>Añadir canción</h2><span id="hint"></span></header>
    <div id="mid"></div>
    <div></div>
  </section>

  <section class="col">
    <header><h2>Cola</h2><span class="num" id="qCount"></span></header>
    <div class="fxbar" id="fx">
      <button class="btn" id="cine" aria-pressed="false">Modo cine</button>
      <button class="btn rose" id="drop">¡Drop!</button>
      <button class="btn" id="beatBtn" aria-pressed="false"><span class="beatdot" id="beatDot"></span><span id="beatTxt">Activar ritmo</span></button>
      <span class="sync" id="sync"></span>
    </div>
    <div class="scorebar" id="scorebar" hidden>
      <div class="sbtop"><span>Medidor</span><b class="num" id="scoreVal">0 · Normal</b><button class="btn" id="scoreHide" type="button">Ocultar</button></div>
      <input type="range" id="score" min="-50" max="50" step="1" value="0" aria-label="Cuánto te gusta la canción, de −50 a +50">
      <div class="sblab num"><span>−50 Basura</span><span>Flojo</span><span>0</span><span>Buena</span><span>Temazo +50</span></div>
    </div>
    <div class="scroll" id="queueWrap"></div>
    <div class="credits" id="credits" hidden></div>
  </section>
</main>

<script type="module">
import { subscribe, progressOf, fmt, esc, icon, avatar } from '/live.js';
import { mountAjustes, updateAjustes } from '/ajustes.js';

const $ = id => document.getElementById(id);
const HOST_USER = { id: '__host', nick: 'Tú', avatar: '' };
let S = null, requester = HOST_USER, picked = null, results = [], note = null, searching = false, midMode = '';
$('brandIcon').innerHTML = icon.rose;
$('setBtn').innerHTML = `${icon.gear}Ajustes`;

const api = async (url, data) => {
  const r = await fetch(url, data === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Algo falló');
  return j;
};

const ajustes = mountAjustes(api);
subscribe(s => {
  const first = !S; S = s;
  renderTop(); renderChat(); renderMid(); renderQueue(); renderScore(); updateAjustes(s);
});

// ---------- barra superior: estado corto; los detalles y los cambios, en Ajustes ----------
function renderTop() {
  const t = S.tiktok;
  $('ttDot').className = `dot ${t.status}`;
  $('ttStatus').textContent = t.user ? `@${t.user} · ${{ on: 'en directo', connecting: 'conectando…', off: t.error ? 'sin directo' : 'desconectado' }[t.status]}` : 'Conecta TikTok';
  $('spDot').className = `dot ${S.spotify.status === 'ok' && !S.spotify.error ? 'ok' : S.spotify.status === 'ok' ? 'connecting' : ''}`;
  $('spStatus').textContent = S.spotify.status !== 'ok' ? 'Conecta Spotify' : S.spotify.error ? 'Spotify · revisa' : S.manual ? 'Spotify · manual' : 'Spotify';
  $('cloudBox').hidden = !S.cloud || S.cloud.status === 'off';
  if (S.cloud) { $('cloudDot').className = `dot ${S.cloud.status === 'ok' ? 'ok' : 'connecting'}`; $('cloudStatus').textContent = S.cloud.status === 'ok' ? 'Supabase' : 'Supabase · revisa'; }
}
// los errores largos se leen en el panel de la cola (Spotify) o en Ajustes
let popKind = null;
function popHtml(k) {
  if (k === 'tt') return `<h4>TikTok</h4>
    <p>${S.tiktok.status === 'on' ? 'Conectado a tu directo.' : S.tiktok.error ? esc(S.tiktok.error) : 'Escribe tu usuario. Se conecta cuando estés en directo.'}</p>
    <form class="row" id="popTt"><input id="popTtUser" value="${S.tiktok.user ? '@' + esc(S.tiktok.user) : ''}" placeholder="@tu_usuario" autocomplete="off" spellcheck="false" aria-label="Usuario de TikTok"><button class="btn primary">${S.tiktok.status === 'on' ? 'Reconectar' : 'Conectar'}</button></form>`;
  if (k === 'sp') return `<h4>Spotify</h4>
    <p>${S.spotify.status !== 'ok' ? 'Sin conectar.' : S.spotify.error ? esc(S.spotify.error) : S.manual ? 'Conectado en modo manual (sin Premium): pones tú cada canción.' : 'Conectado.'}</p>

// ---------- ritmo: escucha el audio del PC desde aquí (no en la pantalla del directo) ----------
// El detector corre en el hilo de audio (beat-worklet.js): sigue aunque esta pestaña quede en segundo plano.
// Cada golpe se manda al servidor y la pantalla del directo late con él.
let beatCtx = null;
$('beatBtn').onclick = async () => {
  if (beatCtx) { await beatCtx.close(); beatCtx = null; $('beatBtn').setAttribute('aria-pressed', 'false'); $('beatTxt').textContent = 'Activar ritmo'; return; }
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true, systemAudio: 'include' });
    if (!stream.getAudioTracks().length) throw new Error('sin audio');
    stream.getVideoTracks().forEach(t => t.enabled = false); // solo hace falta el sonido
    const ctx = new AudioContext();
    await ctx.audioWorklet.addModule('/beat-worklet.js');
    const node = new AudioWorkletNode(ctx, 'beat', { numberOfInputs: 3, numberOfOutputs: 0 });
    const src = ctx.createMediaStreamSource(stream); // no va a los altavoces: solo se mide
    const BANDS = [[['highpass', 30], ['lowpass', 115], ['lowpass', 115]], [['highpass', 1000], ['lowpass', 4000]], [['highpass', 5000], ['lowpass', 12000]]];
    BANDS.forEach((spec, i) => {
      let n = src;
      for (const [type, f] of spec) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = 0.7; n.connect(b); n = b; }
      n.connect(node, 0, i);
    });
    node.port.onmessage = e => {
      fetch('/api/beat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(e.data), keepalive: true }).catch(() => {});
      if (e.data.k !== 'drop' && !document.hidden) { const d = $('beatDot'); d.classList.add('hit'); setTimeout(() => d.classList.remove('hit'), 90); }
    };
    stream.getAudioTracks()[0].addEventListener('ended', () => { if (beatCtx === ctx) $('beatBtn').click(); });
    beatCtx = ctx;
    $('beatBtn').setAttribute('aria-pressed', 'true'); $('beatTxt').textContent = 'Ritmo activo';
  } catch (err) { $('beatTxt').textContent = 'Marca «Compartir audio del sistema»'; console.warn(err); }
};

  if (mv) return api('/api/move', { id: mv.dataset.move, dir: +mv.dataset.dir });
  const pn = e.target.closest('[data-now]');
  if (pn) { pn.disabled = true; try { await api('/api/playnow', { id: pn.dataset.now }); } catch (err) { alert(err.message); } finally { pn.disabled = false; } return; }
  const vb = e.target.closest('[data-verdict]');
  if (vb?.dataset.verdict === 'love' && !S.canLove) { location.href = '/spotify/login'; return; }
  if (vb) { vb.disabled = true; try { await api('/api/verdict', { v: vb.dataset.verdict }); } catch (err) { alert(err.message); } vb.disabled = false; return; }
  const sk = e.target.closest('#skip');
  if (sk) { sk.disabled = true; try { await api('/api/skip', {}); } catch (err) { alert(err.message); } sk.disabled = false; }
});

(function frame() {
  requestAnimationFrame(frame);
  if (!S?.now || !$('npFill')) return;
  const p = progressOf(S.now);
  $('npFill').style.transform = `scaleX(${p / S.now.durationMs})`;
  if ($('saveLeft') && S.judge?.until) $('saveLeft').textContent = Math.min(15, Math.max(0, Math.ceil((S.judge.until - Date.now()) / 1000)));
  $('npCur').textContent = fmt(p);
})();
</script>
</body>
</html>
